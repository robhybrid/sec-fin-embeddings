edgar:
  user_agent: "sec-fin-embeddings/0.1 (open collaborative research; contact via GitHub issues)"
  max_rps: 8.0          # stay under SEC ≤10 req/s
  timeout_s: 60

embed:
  model: gemini-embedding-001
  output_dimensionality: 768
  task_type: RETRIEVAL_DOCUMENT
  # Max chars per chunk ≈ leave headroom under 2048-token input limit.
  max_chars_per_chunk: 6000
  # Prefer MD&A + risk; 1–3 chunks each section when long.
  sections: [mda, risk]
  batch_size: 4         # texts per batchEmbedContents (counts as 1 RPD)

universe:
  tickers_file: data/universe/spy_ndx_tickers.txt
  forms: [10-K, 10-Q]
  priority_years: 2     # most recent N years first

store:
  # Default: local LanceDB (sync to paid object storage / remote later).
  # Community can vote to change via GOVERNANCE.md.
  backend: lancedb
  lancedb_uri: artifacts/lancedb
  table: filings_chunks
  # Optional paid backends (set env + switch backend after governance vote
  # or maintainer config):
  #   pinecone  → PINECONE_API_KEY, PINECONE_INDEX
  #   supabase  → SUPABASE_URL, SUPABASE_SERVICE_KEY (pgvector)
  # Cost notes: see README / docs in project store.

manifest:
  path: manifests/embedded.jsonl

shards:
  claims_dir: data/shards
